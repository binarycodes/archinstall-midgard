#!/usr/bin/nft -f
# Lets the file run directly as a script; nftables.service loads it with
# `nft -f` anyway. Kept as the usual convention for nftables files.

# Make sure the table exists, so the delete below never fails on first boot.
table inet midgard-filter
# Remove only our own table. `flush ruleset` would also wipe the tables podman
# (netavark) creates and cut container networking until `podman network reload`.
delete table inet midgard-filter

# Rebuild the table from the drop-ins, in alphabetical order. The whole file,
# includes too, loads as one transaction: a syntax error anywhere changes nothing.
include "/etc/nftables.d/*.nft"
