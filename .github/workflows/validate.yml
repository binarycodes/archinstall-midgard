name: validate

on:
  push:
    paths:
      - "installer/**"
      - "tests/**"
      - "manifest.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate.yml"
  # no path filter: the gate job must report on every PR to be usable as a required check
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: install
        run: uv sync --frozen

      - name: lint
        run: uv run ruff check

      - name: validate manifest
        run: uv run installer validate

      - name: test
        run: uv run pytest

  # the single required status check for PRs; add every new job to `needs`
  gate:
    name: all checks passed
    if: always()
    needs: [python]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any job failed, was cancelled or skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

      - name: report success
        run: echo "all checks passed"
