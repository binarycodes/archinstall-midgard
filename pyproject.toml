[project]
name = "installer"
version = "0.1.0"
description = "Arch Linux install and maintenance from this repository"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6"]

[project.scripts]
installer = "installer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
# qutebrowser config under dotfiles/ is not ours to lint
extend-exclude = ["dotfiles"]
